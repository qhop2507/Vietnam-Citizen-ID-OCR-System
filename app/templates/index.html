<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>OCR Căn Cước Công Dân</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

<div class="container py-4">

    <h2 class="text-center fw-bold text-primary mb-4">

        <i class="bi bi-person-vcard-fill"></i>

        Vietnam Citizen ID OCR System

    </h2>

    <!-- ========================== -->
    <!-- Row 1 -->
    <!-- ========================== -->

    <div class="row g-4">

        <!-- Input -->

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    Input Image

                </div>

                <div class="card-body text-center">

                    <img id="inputImage"

                         class="preview-image"

                         src="/static/images/no-image.png">

                    <div class="mt-3">

                        <input

                                type="file"

                                id="imageInput"

                                accept="image/*"

                                class="form-control">

                    </div>

                </div>

            </div>

        </div>

        <!-- Card -->

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    Detected ID Card

                </div>

                <div class="card-body text-center">

                    <img id="cardImage"

                         class="preview-image"

                         src="/static/images/no-image.png">

                </div>

            </div>

        </div>

    </div>

    <!-- Buttons -->

    <div class="text-center mt-4">

        <button

                id="detectBtn"

                class="btn btn-primary px-4">

            <i class="bi bi-search"></i>

            Start Recognition

        </button>

        <button

                id="clearBtn"

                class="btn btn-danger">

            <i class="bi bi-trash"></i>

            Delete

        </button>

    </div>

    <!-- Loading -->

    <div

            id="loading"

            class="text-center mt-4"

            style="display:none;">

        <div class="spinner-border text-primary">

        </div>

        <div>

            Processing...

        </div>

    </div>

    <!-- Row 2 -->

    <div class="row mt-5 g-4">

        <!-- Face -->

        <div class="col-lg-3">

            <div class="card shadow">

                <div class="card-header bg-secondary text-white">

                    Portrait Photo

                </div>

                <div class="card-body text-center">

                    <img

                            id="faceImage"

                            class="face-image"

                            src="/static/images/no-face.png">

                </div>

            </div>

        </div>

        <!-- Result -->

        <div class="col-lg-9">

            <div class="card shadow">

                <div class="card-header bg-info text-white">

                    Recognition Results

                </div>

                <div class="card-body">

                    <table class="table table-bordered">

                        <tbody>

                        <tr>

                            <th width="180">Số CCCD</th>

                            <td id="id"></td>

                        </tr>

                        <tr>

                            <th>Họ tên</th>

                            <td id="name"></td>

                        </tr>

                        <tr>

                            <th>Ngày sinh</th>

                            <td id="dob"></td>

                        </tr>

                        <tr>

                            <th>Giới tính</th>

                            <td id="gender"></td>

                        </tr>

                        <tr>

                            <th>Quốc tịch</th>

                            <td id="nationality"></td>

                        </tr>

                        <tr>

                            <th>Quê quán</th>

                            <td id="origin_place"></td>

                        </tr>

                        <tr>

                            <th>Nơi thường trú</th>

                            <td id="current_place"></td>

                        </tr>

                        <tr>

                            <th>Ngày hết hạn</th>

                            <td id="expire_date"></td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="/static/js/main.js"></script>

</body>

</html>
